<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Descrição dos recortes disponíveis nas publicações QuantImport.">
  <title>Recortes | QuantImport</title>
  <style>
    :root {
      --verde: #146b45; --verde-escuro: #0d4931; --dourado: #c8a52b;
      --texto: #20262d; --texto-suave: #667085; --borda: #e3e8e5;
      --fundo: #f4f7f5; --branco: #ffffff; --largura: 1180px;
    }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--texto); background: var(--fundo);
      font-family: Arial, Helvetica, sans-serif; line-height: 1.5; }
    .topo { color: var(--branco); background: linear-gradient(110deg, var(--verde-escuro), var(--verde));
      border-bottom: 4px solid var(--dourado); }
    .topo-conteudo, main, .rodape-conteudo { width: min(var(--largura), calc(100% - 48px)); margin-inline: auto; }
    .topo-conteudo { padding: 22px 0 28px; }
    .marca-linha { display: flex; align-items: center; justify-content: space-between; gap: 24px; }
    .marca { display: inline-flex; align-items: center; gap: 12px; color: var(--branco);
      text-decoration: none; font-size: 1.45rem; font-weight: 700; }
    .marca img { display: block; width: 46px; height: 46px; object-fit: contain; border-radius: 50%; }
    .navegacao { display: flex; flex-wrap: wrap; gap: 18px; }
    .navegacao a { color: var(--branco); text-underline-offset: 4px; }
    .identificacao { margin-top: 28px; }
    .identificacao h1 { margin: 0; font-size: clamp(2.2rem, 5vw, 4rem); line-height: 1; }
    .identificacao p { margin: 10px 0 0; color: #e6f2eb; }
    main { padding: 40px 0 56px; }
    .recorte { max-width: 780px; padding: 28px; background: var(--branco); border: 1px solid var(--borda);
      border-radius: 10px; box-shadow: 0 4px 16px rgba(16,24,40,.06); }
    .recorte p { margin: 0; color: var(--texto-suave); }
    .recorte strong { color: var(--verde-escuro); }
    footer { color: var(--texto-suave); background: var(--branco); border-top: 1px solid var(--borda); }
    .rodape-conteudo { padding: 24px 0; font-size: .92rem; }
    .rodape-conteudo p { margin: 0; }
    @media (max-width: 680px) {
      .topo-conteudo, main, .rodape-conteudo { width: min(100% - 24px, var(--largura)); }
      .marca-linha { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <header class="topo"><div class="topo-conteudo">
    <div class="marca-linha">
      <a class="marca" href="/pages/"><img src="/pages/assets/logo.png" alt="Logotipo QuantImport"><span>QuantImport</span></a>
      <nav class="navegacao" aria-label="Navegação principal">
        <a href="/pages/">Voltar às publicações</a>
      </nav>
    </div>
    <div class="identificacao"><h1>Recortes</h1><p>Conheça as formas de organização geográfica das publicações</p></div>
  </div></header>
  <main>
    <article class="recorte">
      <p><strong>UF</strong> — Unidade da Federação de origem ou destino da operação de comércio exterior em foco.</p>
    </article>
  </main>
  <footer><div class="rodape-conteudo"><p><strong>QuantImport — Inteligência para o Agronegócio</strong></p></div></footer>
</body>
</html>
