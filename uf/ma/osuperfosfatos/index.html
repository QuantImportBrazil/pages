<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta
    name="description"
    content="Previsões QuantImport para O.Superfosfatos em MA."
  >

  <title>O.Superfosfatos — MA | QuantImport</title>

  <style>
    :root {
      --verde: #146b45;
      --verde-escuro: #0d4931;
      --vinho: #7f1734;
      --dourado: #c8a52b;
      --azul: #1769aa;
      --vermelho: #b42318;
      --texto: #20262d;
      --texto-suave: #667085;
      --borda: #e3e8e5;
      --fundo: #f4f7f5;
      --branco: #ffffff;
      --largura: 1180px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      color: var(--texto);
      background: var(--fundo);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.5;
    }

    a {
      color: inherit;
    }

    .topo {
      color: var(--branco);
      background:
        linear-gradient(110deg, var(--verde-escuro), var(--verde));
      border-bottom: 4px solid var(--dourado);
    }

    .topo-conteudo,
    main,
    .rodape-conteudo {
      width: min(var(--largura), calc(100% - 48px));
      margin-inline: auto;
    }

    .topo-conteudo {
      padding: 22px 0 28px;
    }

    .marca-linha {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .marca {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: var(--branco);
      text-decoration: none;
      font-size: 1.45rem;
      font-weight: 700;
      letter-spacing: .01em;
    }

    .marca img {
      display: block;
      width: 46px;
      height: 46px;
      object-fit: contain;
      border-radius: 50%;
    }

    .navegacao {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px 20px;
      font-size: .95rem;
    }

    .navegacao a {
      color: var(--branco);
      text-underline-offset: 4px;
    }

    .identificacao {
      margin-top: 28px;
    }

    .identificacao h1 {
      margin: 0;
      font-size: clamp(2.2rem, 5vw, 4rem);
      line-height: 1;
    }

    .localizacao {
      margin: 10px 0 0;
      font-size: 1.3rem;
      font-weight: 600;
    }

    .emissao {
      margin: 8px 0 0;
      color: #e6f2eb;
      font-size: 1rem;
    }

    main {
      padding: 26px 0 48px;
    }

    .cenario {
      display: block;
      width: 100%;
      margin-bottom: 26px;
      padding: 13px 18px;
      color: var(--branco);
      background: var(--azul);
      border-radius: 8px;
      box-shadow: 0 3px 10px rgba(16, 24, 40, .10);
      text-align: center;
      text-decoration: none;
      font-weight: 700;
    }

    .cenario.extraordinario {
      background: var(--vermelho);
    }

    .grafico {
      margin: 0 0 30px;
      padding: 24px 34px 32px;
      background: var(--branco);
      border: 1px solid var(--borda);
      border-radius: 10px;
      box-shadow: 0 4px 16px rgba(16, 24, 40, .06);
    }

    .grafico h2 {
      margin: 0 0 18px;
      color: var(--verde-escuro);
      font-size: 1.3rem;
    }

    .grafico img {
      display: block;
      width: 100%;
      height: auto;
    }

    .imagens-detalhamento {
      display: grid;
      gap: 32px;
    }

    footer {
      color: var(--texto-suave);
      background: var(--branco);
      border-top: 1px solid var(--borda);
    }

    .rodape-conteudo {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      padding: 24px 0;
      font-size: .92rem;
    }

    .rodape-conteudo p {
      margin: 0;
    }

    @media (max-width: 680px) {
      .topo-conteudo,
      main,
      .rodape-conteudo {
        width: min(100% - 24px, var(--largura));
      }

      .marca-linha,
      .rodape-conteudo {
        align-items: flex-start;
        flex-direction: column;
      }

      .navegacao {
        justify-content: flex-start;
      }

      .grafico {
        padding: 16px;
      }
    }
  </style>
</head>

<body>

  <header class="topo">
    <div class="topo-conteudo">

      <div class="marca-linha">

        <a class="marca" href="/pages/">
          <img
            src="/pages/assets/logo.png"
            alt="Logotipo QuantImport"
          >
          <span>QuantImport</span>
        </a>

        <nav
          class="navegacao"
          aria-label="Navegação principal"
        >
          <a href="/pages/">Voltar às publicações</a>

          <a href="/pages/como-interpretar/">
            Como interpretar os gráficos
          </a>
        </nav>

      </div>

      <div class="identificacao">
        <h1>O.Superfosfatos</h1>
        <p class="localizacao">MA</p>
        <p class="emissao">
          <strong>Emissão:</strong> maio
        </p>
      </div>

    </div>
  </header>

  <main>

    <a
      class="cenario"
      href="/pages/cenarios/base/"
    >
      Cenário-base: sem ocorrência extraordinária considerada
    </a>


        <section class="grafico">
          <h2>Visão Geral</h2>
          <img
            src="images/overview.png"
            alt="Visão geral das previsões"
          >
        </section>
    

        <section class="grafico grafico-detalhamento">
          <h2>Detalhamento</h2>
          <div class="imagens-detalhamento">

            <img
              src="images/2º.png"
              alt="Gráfico de detalhamento das previsões"
            >
        
            <img
              src="images/3º.png"
              alt="Gráfico de detalhamento das previsões"
            >
        
            <img
              src="images/4º.png"
              alt="Gráfico de detalhamento das previsões"
            >
        
          </div>
        </section>
    

  </main>

  <footer>
    <div class="rodape-conteudo">

      <p>
        <strong>
          QuantImport — Inteligência para o Agronegócio
        </strong>
      </p>

      <p>Data de publicação: 07/08/2026</p>

    </div>
  </footer>

</body>
</html>
